            background-image:

                radial-gradient(1px 1px at 12% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),

            position: relative;
            overflow: hidden;
        }

            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }
        .choice-card:hover::before { opacity: 1; }
        .choice-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 80px rgba(139, 92, 246, 0.25), 0 0 50px rgba(139, 92, 246, 0.08);

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .gradient-border-wrap {
            background: linear-gradient(135deg, #7c3aed, #06b6d4, #f59e0b, #ec4899, #7c3aed);

            animation: borderFlow 6s ease infinite;

            to { opacity: 1; transform: translateY(0); }

            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }

            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }

        .progress-fill { transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

        /* Stat bar */
        .stat-bar-fill { transition: width 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s; }

        .knowledge-panel {

            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;

        }

        ::-webkit-scrollbar { width: 5px; }

            backdrop-filter: blur(20px);

        @keyframes particleDrift {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-30px) translateX(10px) scale(0); opacity: 0; }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(139,92,246,0); }

        .fx-star {

        }
        .fx-blink-fast { animation: star-blink 0.2s infinite; }
        .fx-blink-medium { animation: star-blink 0.6s infinite; }
        .fx-blink-slow { animation: star-blink 2s infinite; }
        
        @keyframes star-blink {
            0%, 100% { opacity: 0.1; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Glassmorphism components */
        .glass {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* Page transition */
        .page-enter {
            animation: fadeInUp 0.5s ease-out;
        }

        /* Pixel Art Animations */
        @keyframes animBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .anim-blink { animation: animBlink 2s infinite; }
        
        @keyframes animFlag {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.7); }
        }
        .anim-flag { animation: animFlag 1s infinite; transform-origin: left center; }

            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
        }
        .anim-float-up { animation: animFloatUp 3s infinite linear; }
    </style>
</head>

        // ==================== SVG RADAR CHART ====================
        function RadarChart({ stats, maxVal = 50, size = 300 }) {
            const center = size / 2;
            const radius = size / 2 - 35;
            const dims = Object.keys(DIMS);
            const angleStep = (2 * Math.PI) / dims.length;

            const getPoint = (index, value) => {
                const angle = angleStep * index - Math.PI / 2;
                const r = (Math.min(value, maxVal) / maxVal) * radius;
                return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
            };

            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                    <defs>
                        <radialGradient id="radarGlow">
                            <stop offset="0%" stopColor="rgba(139,92,246,0.3)" />
                            <stop offset="100%" stopColor="rgba(139,92,246,0)" />
                        </radialGradient>
                    </defs>
                    {/* Background glow */}
                    <circle cx={center} cy={center} r={radius} fill="url(#radarGlow)" />

                    {/* Grid rings */}
                    {[0.2, 0.4, 0.6, 0.8, 1].map((level, i) => {
                        const pts = dims.map((_, idx) => {
                            const a = angleStep * idx - Math.PI / 2;
                            return `${center + radius * level * Math.cos(a)},${center + radius * level * Math.sin(a)}`;
                        }).join(' ');
                        return <polygon key={i} points={pts} fill="none" stroke="rgba(139,92,246,0.12)" strokeWidth="1" />;
                    })}

                    {/* Axis lines */}
                    {dims.map((_, idx) => {
                        const a = angleStep * idx - Math.PI / 2;
                        return <line key={idx} x1={center} y1={center}
                            x2={center + radius * Math.cos(a)} y2={center + radius * Math.sin(a)}
                            stroke="rgba(139,92,246,0.15)" strokeWidth="1" />;
                    })}

                    {/* Data area */}
                    <polygon
                        points={dims.map((dim, idx) => { const p = getPoint(idx, stats[dim] || 0); return `${p.x},${p.y}`; }).join(' ')}
                        fill="rgba(139,92,246,0.2)" stroke="url(#radarStroke)" strokeWidth="2.5"
                    />
                    <defs>
                        <linearGradient id="radarStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#8b5cf6" /><stop offset="100%" stopColor="#06b6d4" />
                        </linearGradient>
                    </defs>

                    {/* Points & Labels */}
                    {dims.map((dim, idx) => {
                        const p = getPoint(idx, stats[dim] || 0);
                        const a = angleStep * idx - Math.PI / 2;
                        const lx = center + (radius + 25) * Math.cos(a);
                        const ly = center + (radius + 25) * Math.sin(a);
                        return (
                            <g key={dim}>
                                <circle cx={p.x} cy={p.y} r="6" fill={DIMS[dim].color} stroke="#fff" strokeWidth="2" />
                                <circle cx={p.x} cy={p.y} r="10" fill={DIMS[dim].color} opacity="0.2" />
                                <text x={lx} y={ly - 6} textAnchor="middle" fill={DIMS[dim].color} fontSize="11" fontWeight="700">
                                    {DIMS[dim].icon}
                                </text>
                                <text x={lx} y={ly + 8} textAnchor="middle" fill="#94a3b8" fontSize="10">
                                    {stats[dim] || 0}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

// ==================== CANVAS PIXEL ART ENGINE ====================
        
const PixelCivilization = ({ choices, stage, resultMode = false }) => {
    const canvasRef = React.useRef(null);
    const [imagesLoaded, setImagesLoaded] = React.useState(false);
    const assets = React.useRef({});
    
    const c1 = choices[0]?.id;
    const c2 = choices[1]?.id;
    const c3 = choices[2]?.id;
    const c4 = choices[3]?.id;
    const civilization = c1 === '1A' ? 'Egypt' : c1 === '1B' ? 'Greece' : 'None';
    
    // Load images from Base64 IMAGE_ASSETS (bypasses CORS restrictions)
    React.useEffect(() => {
        let loaded = 0;
        const total = Object.keys(IMAGE_ASSETS).length;
        
        const removeGreenScreen = (img, key) => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);
            
            // Only process green screen for overlay sprites (not backgrounds)
            if (!key.startsWith('bg_')) { 
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    // Pure green screen removal (tolerance)
                    if (g > 100 && g > r * 1.2 && g > b * 1.2) {
                        data[i+3] = 0; // Make transparent
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }
            return canvas;
        };

        for (const [key, dataUri] of Object.entries(IMAGE_ASSETS)) {
            const img = new Image();
            img.onload = () => {
                assets.current[key] = removeGreenScreen(img, key);
                loaded++;
                if (loaded === total) setImagesLoaded(true);
            };
            img.onerror = () => {
                console.error("Failed to load", key);
                loaded++;
                if (loaded === total) setImagesLoaded(true);
            };
            img.src = dataUri;
        }
    }, []);

    const [blinkPhase, setBlinkPhase] = React.useState('none');

    React.useEffect(() => {
        if (choices.length < 2) return;
        setBlinkPhase('fast');
        const t1 = setTimeout(() => setBlinkPhase('medium'), 800);
        const t2 = setTimeout(() => setBlinkPhase('slow'), 2500);

    }, [choices.length]);

        '2A1': { x: 45, y: 40 }, // Pyramids
        '2A2': { x: 50, y: 45 }, // Aqueduct
        '2B1': { x: 50, y: 30 }, // Parthenon
        '2B2': { x: 50, y: 60 }, // Sparta Phalanx
        '3.1': { x: 35, y: 70 }, // Silk Road
        '3.2': { x: 65, y: 65 }, // Diplomacy
        '3.3': { x: 20, y: 50 }, // Isolationism walls
        '4.1': { x: 70, y: 35 }, // Wonders
        '4.2': { x: 50, y: 75 }, // Trade Hub
    };
    
    const latestChoiceId = choices.length >= 2 ? choices[choices.length - 1]?.id : null;
    const fxCoord = latestChoiceId ? FX_COORDS[latestChoiceId] : null;

    // Draw Static Scene
    React.useEffect(() => {
        if (!imagesLoaded) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        
        // Build scene key from choices, try most specific first then fallback
        const c1 = choices[0]?.id;
        const c2 = choices[1]?.id;
        const c3 = choices[2]?.id;
        const c4 = choices[3]?.id;
        
        // Try keys from most specific to least specific
        const candidateKeys = [];
        if (c4) candidateKeys.push(`scene_${c1}_${c2}_${c3}_${c4}`.replace(/\./g,''));
        if (c3) candidateKeys.push(`scene_${c1}_${c2}_${c3}`.replace(/\./g,''));
        if (c2) candidateKeys.push(`scene_${c1}_${c2}`);
        if (c1) candidateKeys.push(`scene_${c1}`);
        // Final fallback to original backgrounds
        candidateKeys.push(c1 === '1A' ? 'bg_egypt' : c1 === '1B' ? 'bg_greece' : null);
        
        const sceneKey = candidateKeys.find(k => k && assets.current[k]) || null;
        const sceneImg = sceneKey ? assets.current[sceneKey] : null;
        
        // Clear
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, H);
        
        if (sceneImg) {
            // Cover-fit: fill canvas preserving aspect ratio
            const imgAspect = sceneImg.width / sceneImg.height;
            const canvasAspect = W / H;
            let sx = 0, sy = 0, sw = sceneImg.width, sh = sceneImg.height;
            if (imgAspect > canvasAspect) {
                sw = sceneImg.height * canvasAspect;
                sx = (sceneImg.width - sw) / 2;
            } else {
                sh = sceneImg.width / canvasAspect;
                sy = (sceneImg.height - sh) / 2;
            }
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(sceneImg, sx, sy, sw, sh, 0, 0, W, H);
        } else {
            // No image at all - draw gradient placeholder
            const grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, '#0f172a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('เลือกอารยธรรมเพื่อเริ่มต้น', W/2, H/2);
            ctx.textAlign = 'left';
        }
        
        // Subtle vignette for cinematic feel
        const vig = ctx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.75);
        vig.addColorStop(0, 'transparent');
        vig.addColorStop(1, 'rgba(0,0,0,0.45)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);

    }, [imagesLoaded, choices, stage]);

    const baseClass = resultMode ? "w-full max-w-4xl mx-auto h-[400px] mb-8" : "w-full max-w-4xl mx-auto h-72 md:h-96 mb-6";
    
    return (
        <div className={`${baseClass} relative rounded-3xl border border-white/10 overflow-hidden bg-[#0f172a] shadow-2xl anim-scale-in`}
             style={{ boxShadow: '0 15px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.9)', animationDelay: '300ms' }}>
            {!imagesLoaded && <div className="absolute inset-0 flex items-center justify-center text-white text-lg font-bold animate-pulse z-10 bg-black/50">กำลังโหลดฉาก Voxel...</div>}
            <canvas 
                ref={canvasRef} 
                width={800} 
                height={400} 
                className="w-full h-full object-cover relative z-0"
                style={{ imageRendering: 'auto' }}
            />
            
            {/* Visual Effect Overlay */}
            {fxCoord && (
                <div 
                    className="absolute z-10 pointer-events-none transition-all duration-1000 ease-out"
                    style={{ left: `${fxCoord.x}%`, top: `${fxCoord.y}%`, transform: 'translate(-50%, -50%)' }}
                >
                    <div className="relative">
                        <div className={`absolute -top-2 -left-6 text-amber-200 text-xl fx-star fx-blink-${blinkPhase}`} style={{ textShadow: '0 0 15px #fbbf24', animationDelay: '0.1s' }}>✦</div>
                        <div className={`absolute -top-6 -left-2 text-yellow-300 text-3xl fx-star fx-blink-${blinkPhase}`} style={{ textShadow: '0 0 20px #f59e0b' }}>✦</div>
                        <div className={`absolute -top-2 left-4 text-amber-200 text-xl fx-star fx-blink-${blinkPhase}`} style={{ textShadow: '0 0 15px #fbbf24', animationDelay: '0.2s' }}>✦</div>
                    </div>
                </div>
            )}
            <div className="absolute top-4 left-4 text-xs font-bold text-white/50 bg-black/40 px-3 py-1 rounded-md border border-white/10 z-20">
                VOXEL_ENGINE: V3.0
            </div>
            {!resultMode && (
                <div className="absolute bottom-4 right-4 flex gap-2 z-20">
                    {[0,1,2,3].map(i => (
                        <div key={i} className={`w-3 h-3 rounded-full transition-all duration-500 ${choices[i] ? 'bg-purple-500 shadow-[0_0_8px_#a855f7]' : 'bg-gray-700/50'}`} />
                    ))}
                </div>
            )}
        </div>
    );
};

        // ==================== MAIN APP ====================
        function App() {
            const [phase, setPhase] = useState('intro');
            const [stage, setStage] = useState(0);
            const [stats, setStats] = useState({ M: 0, E: 0, K: 0, A: 0, C: 0 });
            const [choices, setChoices] = useState([]);
            const [openKnowledge, setOpenKnowledge] = useState(null);
            const [transitioning, setTransitioning] = useState(false);

            const getOptions = useCallback(() => {
                const data = GAME_DATA[stage];
                if (!data) return [];
                if (stage === 1 && choices.length > 0) {
                    return choices[0].id === '1A' ? data.options_from_1A : data.options_from_1B;
                }
                return data.options;
            }, [stage, choices]);

            const handleChoice = useCallback((option) => {
                setTransitioning(true);
                const newStats = { ...stats };
                Object.entries(option.stats).forEach(([k, v]) => { newStats[k] += v; });
                setTimeout(() => {
                    setStats(newStats);
                    setChoices([...choices, option]);
                    if (stage >= 3) setPhase('result');
                    else setStage(stage + 1);
                    setTransitioning(false);
                    setOpenKnowledge(null);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 500);
            }, [stats, choices, stage]);

            const score = useMemo(() => {
                const weighted = {};
                let total = 0;
                const mults = {};
                Object.entries(stats).forEach(([d, v]) => {
                    let m = 1;
                    if (v >= 40) m = 2.0;
                    else if (v >= 30) m = 1.5;
                    mults[d] = m;
                    weighted[d] = Math.round(v * m);
                    total += weighted[d];
                });
                let rank = 'D', rc = '#6b7280', rg = 'rgba(107,114,128,0.4)';
                if (total >= 135) { rank = 'S'; rc = '#ffd700'; rg = 'rgba(255,215,0,0.5)'; }
                else if (total >= 120) { rank = 'A'; rc = '#a855f7'; rg = 'rgba(168,85,247,0.5)'; }
                else if (total >= 110) { rank = 'B'; rc = '#3b82f6'; rg = 'rgba(59,130,246,0.5)'; }
                else if (total >= 95) { rank = 'C'; rc = '#22c55e'; rg = 'rgba(34,197,94,0.5)'; }
                return { weighted, total, rank, rc, rg, mults };
            }, [stats]);

            const civTitle = useMemo(() => {
                const sorted = Object.entries(stats).sort((a, b) => b[1] - a[1]);
                if (sorted[0][1] >= 30 && sorted[1][1] >= 20) {
                    const key = [sorted[0][0], sorted[1][0]].sort().join('');
                    return CIV_TITLES[key] || CIV_TITLES.default;
                }
                if (sorted[0][1] >= 30) return CIV_TITLES[sorted[0][0]] || CIV_TITLES.default;
                return CIV_TITLES.default;
            }, [stats]);

            const reset = () => {

                                    onClick={() => setOpenKnowledge(null)}>
                                    {getOptions().filter(o => o.id === openKnowledge).map(opt => (
                                        <div key={opt.id} className="bg-[#0f172a] border border-purple-500/30 rounded-3xl p-6 max-w-2xl w-full shadow-2xl relative"
                                            onClick={e => e.stopPropagation()}>
                                            <button

                                                onClick={() => setOpenKnowledge(null)}>
                                                ✕
                                            </button>
                                            <div className="mb-6">
                                                <h3 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 flex items-center gap-2">
                                                    <span className="text-3xl">📚</span> สาระความรู้: {opt.name}
                                                </h3>
                                                <p className="text-purple-300/70 text-sm mt-1">{opt.subtitle}</p>
                                            </div>
                                            
                                            <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                                                {opt.knowledge.map((item, i) => (
                                                    <div key={i} className="flex gap-3 bg-purple-900/20 p-4 rounded-xl border border-purple-500/10">
                                                        <span className="text-purple-400 text-lg flex-shrink-0">▸</span>
                                                        <p className="text-sm text-purple-100/90 leading-relaxed">{item}</p>

                                            <button

                                                onClick={() => setOpenKnowledge(null)}>
                                                ปิดหน้าต่าง
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ========== RESULT ==========
            if (phase === 'result') {
                const { weighted, total, rank, rc, rg, mults } = score;

                return (
                    <div className="min-h-screen p-4 md:p-8 page-enter">
                        <div className="max-w-6xl mx-auto">
                            {/* Header */}
                            <div className="text-center mb-10 anim-fade-up">
                                <div className="text-4xl mb-3 float-anim">⚜️</div>

                            {/* === SHOWCASE BANNER === */}

                                {/* Final Pixel Art Display */}
                                <PixelCivilization choices={choices} stage={4} resultMode={true} />

                                <div className="grid md:grid-cols-[1.2fr_auto_1.3fr] gap-8 items-center">

                                    <div className="text-center md:text-left anim-slide-left" style={{ animationDelay: '400ms' }}>
                                        {/* Rank */}
                                        <div className="inline-flex items-center justify-center mb-5">
                                            <div className="rank-glow relative w-32 h-32 rounded-full flex items-center justify-center"
                                                style={{ background: `radial-gradient(circle, ${rg} 0%, transparent 70%)`, border: `3px solid ${rc}`, color: rc }}>

                                            {civTitle}
                                        </h2>

                                        <div className="inline-flex items-center gap-3 px-5 py-2.5 rounded-2xl glass mb-5">
                                            <span className="text-gray-400 text-sm">คะแนนรวม</span>
                                            <span className="text-3xl font-black tabular-nums" style={{ color: rc }}>{total}</span>
                                            <span className="text-gray-600 text-sm">/ 160</span>
                                        </div>

                                        <div className="flex flex-wrap gap-2 justify-center md:justify-start">
                                            {choices.map((c, i) => (
                                                <span key={i} className="text-xs px-3 py-1.5 rounded-lg font-medium"
                                                    style={{ backgroundColor: c.accent + '15', color: c.accent, border: `1px solid ${c.accent}25` }}>
                                                    {c.icon} {c.name}
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    {/* CENTER: Visual */}
                                    <div className="flex flex-col items-center gap-5 anim-scale-in" style={{ animationDelay: '600ms' }}>
                                        {/* Stacked icons */}
                                        <div className="relative w-72 h-44 rounded-2xl bg-gradient-to-b from-indigo-950/60 to-amber-950/30 border border-white/10 overflow-hidden">
                                            <div className="absolute inset-0 flex items-end justify-center gap-5 p-5">
                                                {choices.map((c, i) => (
                                                    <div key={i} className={`flex flex-col items-center icon-bob-${(i % 4) + 1}`}>
                                                        <span className="text-5xl mb-1 drop-shadow-lg">{c.icon}</span>
                                                        <span className="text-[9px] text-gray-400 text-center max-w-[65px] leading-tight font-medium">
                                                            {c.subtitle}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-amber-900/20 to-transparent" />
                                        </div>

                                        <RadarChart stats={stats} />
                                    </div>

                                    {/* RIGHT: Stats */}
                                    <div className="anim-slide-right" style={{ animationDelay: '500ms' }}>
                                        <h3 className="text-lg font-bold mb-5 flex items-center gap-2">
                                            <span className="text-xl">📊</span>
                                            <span className="bg-gradient-to-r from-purple-300 to-cyan-300 bg-clip-text text-transparent">
                                                พลังอารยธรรม 5 มิติ
                                            </span>
                                        </h3>

                                        <div className="space-y-3">
                                            {Object.entries(DIMS).map(([k, d]) => {
                                                const base = stats[k];
                                                const mult = mults[k];
                                                const final = weighted[k];
                                                return (
                                                    <div key={k} className="glass rounded-xl p-3.5">
                                                        <div className="flex items-center justify-between mb-1.5">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-lg">{d.icon}</span>
                                                                <span className="text-sm font-semibold">{d.name}</span>
                                                            </div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-sm text-gray-400 tabular-nums">{base}</span>
                                                                {mult > 1 && (
                                                                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-md
                                                                        ${mult === 2 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                                                        'bg-purple-500/20 text-purple-300 border border-purple-500/30'}`}>
                                                                        ×{mult}
                                                                    </span>
                                                                )}
                                                                <span className="text-sm font-black tabular-nums" style={{ color: d.color }}>= {final}</span>
                                                            </div>
                                                        </div>
                                                        <div className="w-full h-2 bg-gray-800/60 rounded-full overflow-hidden">
                                                            <div className="h-full rounded-full stat-bar-fill"
                                                                style={{ width: `${Math.min((final / 80) * 100, 100)}%`,
                                                                    background: `linear-gradient(90deg, ${d.color}66, ${d.color})` }} />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <div className="mt-4 p-3.5 rounded-xl bg-amber-500/5 border border-amber-500/20">
                                            <p className="text-xs text-amber-300/90 font-bold mb-1">💡 เกณฑ์ทวีคูณ (Multiplier)</p>
                                            <p className="text-[11px] text-gray-400 leading-relaxed">
                                                พลัง ≥ 30 → ×1.5 (ผู้เชี่ยวชาญ) &nbsp;|&nbsp; พลัง ≥ 40 → ×2.0 (สุดยอด)
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Tier Legend */}
                            <div className="mb-10 anim-fade-up" style={{ animationDelay: '700ms' }}>
                                <h3 className="text-center text-lg font-bold mb-5 bg-gradient-to-r from-amber-300 to-purple-300 bg-clip-text text-transparent">
                                    🏆 ระดับอันดับอารยธรรม
                                </h3>
                                <div className="flex flex-wrap justify-center gap-3">
                                    {[
                                        { r: 'S', l: '≥135', c: '#ffd700', t: 'ตำนาน', e: '✨' },
                                        { r: 'A', l: '120-134', c: '#a855f7', t: 'รุ่งเรือง', e: '🌟' },
                                        { r: 'B', l: '110-119', c: '#3b82f6', t: 'มั่นคง', e: '💎' },
                                        { r: 'C', l: '95-109', c: '#22c55e', t: 'พัฒนา', e: '🌿' },
                                        { r: 'D', l: '<95', c: '#6b7280', t: 'กระจาย', e: '🌫️' }
                                    ].map(tier => (
                                        <div key={tier.r} className={`flex items-center gap-2.5 px-5 py-2.5 rounded-xl border transition-all
                                            ${rank === tier.r ? 'glass border-white/20 scale-105 shadow-lg' : 'bg-white/[0.02] border-white/5'}`}
                                            style={rank === tier.r ? { boxShadow: `0 0 30px ${tier.c}30` } : {}}>
                                            <span className="font-cinzel text-2xl font-black" style={{ color: tier.c }}>{tier.r}</span>
                                            <div>
                                                <div className="text-xs font-bold flex items-center gap-1">
                                                    {tier.e} {tier.t}
                                                </div>
                                                <div className="text-[10px] text-gray-500">{tier.l} คะแนน</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Detailed Path Review */}
                            <div className="mb-10 anim-fade-up" style={{ animationDelay: '800ms' }}>
                                <h3 className="text-center text-lg font-bold mb-5 bg-gradient-to-r from-purple-300 to-cyan-300 bg-clip-text text-transparent">
                                    📜 บันทึกเส้นทางอารยธรรม
                                </h3>
                                <div className="grid md:grid-cols-2 gap-4">
                                    {choices.map((choice, idx) => (
                                        <div key={idx} className="glass rounded-xl p-5">
                                            <div className="flex items-center gap-2.5 mb-3">
                                                <span className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-black
                                                    bg-gradient-to-br from-purple-500/50 to-blue-500/50 border border-purple-400/30">
                                                    {idx + 1}
                                                </span>
                                                <div>
                                                    <div className="text-[10px] text-gray-500 font-medium">{GAME_DATA[idx].titleEn}</div>
                                                    <div className="text-xs text-gray-400">{GAME_DATA[idx].title}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2.5 mb-3">
                                                <span className="text-2xl">{choice.icon}</span>
                                                <div>
                                                    <span className="font-bold text-sm">{choice.name}</span>
                                                    <span className="block text-xs font-medium" style={{ color: choice.accent }}>{choice.subtitle}</span>
                                                </div>
                                            </div>
                                            <p className="text-[11px] text-gray-400 mb-3 leading-relaxed">{choice.knowledge[0]}</p>
                                            <div className="flex gap-2">
                                                {Object.entries(choice.stats).map(([k, v]) => (
                                                    <span key={k} className="text-[10px] px-2 py-1 rounded-md font-bold"
                                                        style={{ backgroundColor: DIMS[k].bg, color: DIMS[k].color }}>
                                                        {DIMS[k].icon} +{v}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Restart */}
                            <div className="text-center pb-8 anim-fade-up" style={{ animationDelay: '1000ms' }}>
                                <button onClick={reset} id="restart-btn"
                                    className="px-12 py-5 rounded-2xl font-bold text-lg
                                        bg-gradient-to-r from-purple-600 via-violet-600 to-blue-600
                                        hover:from-purple-500 hover:via-violet-500 hover:to-blue-500
                                        transform hover:scale-105 active:scale-95 transition-all duration-300
                                        shadow-2xl shadow-purple-500/30 hover:shadow-purple-500/50 btn-pulse">
                                    🔄 สำรวจเส้นทางใหม่
                                </button>
                                <p className="mt-4 text-sm text-gray-500">
                                    มีทั้งหมด <span className="text-purple-400 font-bold">24 รูปแบบ</span> อารยธรรมที่แตกต่างกัน — ลองหา
                                    <span className="font-cinzel text-amber-400 font-bold"> Rank S</span>!
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
